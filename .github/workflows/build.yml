name: Construire MG4 Link
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Décompresser le projet
        run: unzip -o mg4link.zip -d projet
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compiler
        run: gradle -p projet assembleDebug --no-daemon --stacktrace
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp projet/app/build/outputs/apk/debug/app-debug.apk MG4Link.apk
          gh release create "v0.1-build${{ github.run_number }}" MG4Link.apk \
            --repo "${{ github.repository }}" \
            --title "MG4 Link v0.1 (build ${{ github.run_number }})" \
            --notes "Version de test"

            
