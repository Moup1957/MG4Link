name: Construire MG4 Link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:name: Construire MG4 Link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MG4Link.apk
          gh release create "v0.3-build${{ github.run_number }}" MG4Link.apk --repo "${{ github.repository }}" --title "MG4 Link v0.3 (build ${{ github.run_number }})" --notes "Compilation depuis les sources du dépôt" --clobber
  contents: write
